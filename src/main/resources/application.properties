# --- Configurazione Database H2 (in-memory) ---
spring.datasource.url=jdbc:h2:mem:hackhubdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Abilita la console web di H2 ---
# (Ti permetterà di vedere il database dal browser su http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Configurazione JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ddl-auto=update dice a Spring di leggere le tue @Entity e creare/aggiornare
# le tabelle nel database automaticamente ad ogni avvio.
spring.jpa.hibernate.ddl-auto=update

# Mostra nel terminale le query SQL che Spring esegue (molto utile per il debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

